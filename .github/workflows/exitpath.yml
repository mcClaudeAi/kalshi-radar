# Backtest data: what each trade in backtest.json could have been sold for at every minute after the trade check, printed to the job log (public market data only).
name: Exit prices for the backtest
on:
  workflow_dispatch:
    inputs:
      coins: { description: 'Coins as a JSON list', default: '["BTC","ETH","SOL","XRP","DOGE","BNB","HYPE","ZEC","NEAR"]' }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        coin: ${{ fromJSON(github.event.inputs.coins) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node research/exitpath.mjs ${{ matrix.coin }}
