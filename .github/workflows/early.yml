# Research: the leader and chart readings at chosen minutes of every market, printed to the job log (public market data only).
name: Early entry readings
on:
  workflow_dispatch:
    inputs:
      coins: { description: 'Coins as a JSON list', default: '["BTC","ETH","SOL","XRP","DOGE","BNB","HYPE","ZEC","NEAR"]' }
      days: { description: 'Days back', default: '90' }
      mins: { description: 'First-last minute after the open (5 is the trade check)', default: '1-5' }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        coin: ${{ fromJSON(github.event.inputs.coins) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node research/early.mjs ${{ matrix.coin }} ${{ github.event.inputs.days }} 0.85 ${{ github.event.inputs.mins }}
