<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060913">
<title>Kalshi Radar</title>
<!-- MC 2026-10-15 dashboard v2: everything the bot knows on one page, live. Polls /data every 10s. Tabs for overview, open
     copies, closed copies (filterable), wallets (with a detail panel), go-live, tests and the search. No libraries: charts are
     plain SVG so the page loads fast on a phone. -->
<style>
:root{color-scheme:dark;
 --bg:#0a0c0f;--s1:#111419;--s2:#171b21;--s3:#1e232b;--line:#242a33;--line2:#2e3540;
 --ink:#eef1f5;--ink2:#c4cbd5;--mute:#8a94a3;--faint:#5c6675;
 --kx:#19c37d;--kolc:#f0b429;--proven:#3987e5;--trial:#d95926;--total:#eef1f5;
 --good:#2fbf62;--bad:#e66767;--warn:#e0a52b;--accent:#7c8cff;
 --r:14px;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;
 --bg:#f4f5f7;--s1:#ffffff;--s2:#f7f8fa;--s3:#eef0f3;--line:#e4e7ec;--line2:#d6dae1;
 --ink:#0d1117;--ink2:#2f3742;--mute:#5d6775;--faint:#8b94a1;
 --kx:#0f9d63;--kolc:#a86f00;--proven:#2a78d6;--trial:#eb6834;--total:#0d1117;--good:#0f8a3c;--bad:#c93636;--warn:#a86f00;--accent:#4a5bd6}}
:root[data-theme="light"]{color-scheme:light;
 --bg:#f4f5f7;--s1:#ffffff;--s2:#f7f8fa;--s3:#eef0f3;--line:#e4e7ec;--line2:#d6dae1;
 --ink:#0d1117;--ink2:#2f3742;--mute:#5d6775;--faint:#8b94a1;
 --kx:#0f9d63;--kolc:#a86f00;--proven:#2a78d6;--trial:#eb6834;--total:#0d1117;--good:#0f8a3c;--bad:#c93636;--warn:#a86f00;--accent:#4a5bd6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 0 calc(70px + env(safe-area-inset-bottom))}
.num,td.n,.k b{font-variant-numeric:tabular-nums}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;height:56px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.beat span#ago{white-space:nowrap}
@media (max-width:480px){.hd{gap:8px}.logo{font-size:15px}.beat{font-size:11px}}
.logo i{width:26px;height:26px;border-radius:8px;background:radial-gradient(circle at 30% 30%,#9aa6ff,#4b5bd8 60%,#26307d);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.wv{max-width:520px;margin:0 auto}
.wv .hd{display:flex;align-items:center;gap:10px;margin-bottom:22px}.wv .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ab9ff2,#5636e8);display:grid;place-items:center;color:#fff;font-weight:700}
.wv .tot{text-align:center;padding:10px 0 4px}.wv .tot .big{font-size:44px;font-weight:750;letter-spacing:-.02em;color:var(--ink)}.wv .tot .chg{margin-top:6px;font-size:15px;font-weight:600}
.wv .acts{display:flex;justify-content:center;gap:10px;margin:18px 0 22px;flex-wrap:wrap}.wv .acts a{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:84px;padding:12px 10px;border-radius:14px;background:var(--s2);color:var(--ink2);text-decoration:none;font-size:12px;font-weight:600;border:1px solid var(--line)}
.wv .acts a b{font-size:18px;color:var(--accent)}
.wv .tk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--s2);border:1px solid var(--line);margin-bottom:8px;text-decoration:none;color:inherit}
.wv .lg{width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;background:var(--s3);display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden}
.wv .tk .nm{flex:1;min-width:0}.wv .tk .nm div:first-child{font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wv .tk .nm div:last-child,.wv .tk .vl div:last-child{font-size:12px;color:var(--mute);margin-top:2px}
.wv .tk .vl{text-align:right;flex:none}.wv .tk .vl div:first-child{font-weight:650;color:var(--ink)}
.wv .bot{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);margin-left:6px;vertical-align:1px}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--s3);color:var(--ink2)}
.pill.live{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.sp{flex:1}
.beat{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:pulse 2s infinite}
.dot.stale{background:var(--warn);animation:none}.dot.dead{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.iconbtn{border:1px solid var(--line);background:var(--s1);color:var(--ink2);border-radius:10px;height:32px;min-width:32px;display:grid;place-items:center;cursor:pointer;font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mute);padding:8px 12px;border-radius:10px;font:600 13px/1 inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--s3);color:var(--ink)}
.tab .c{font-size:11px;color:var(--faint);margin-left:5px}
main{padding:18px 0 30px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:1/-1}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.span3{grid-column:1/-1}}
@media (max-width:640px){.g4,.g2{grid-template-columns:1fr}.span2{grid-column:1/-1}}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:8px}
.card.livec{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 7%,var(--s1)),var(--s1) 60%)}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint)}
.hero{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px}
@media (max-width:980px){.hero{grid-template-columns:1fr 1fr}.hero .card:first-child{grid-column:1/-1}}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.mid{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sub{color:var(--mute);font-size:13px;margin-top:6px}
.pos{color:var(--good)}.neg{color:var(--bad)}.zero{color:var(--mute)}
.row{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.k{min-width:0}.k span{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:700}.k b{display:block;font-size:15px;font-weight:650;margin-top:3px}
.tier{display:inline-flex;align-items:center;gap:6px;font-weight:650}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.sw.p{background:var(--proven)}.sw.t{background:var(--trial)}.sw.d{background:#a45ee0}.sw.k{background:#f0b429}.sw.a{background:var(--total)}
.g1{grid-template-columns:1fr}.lpcw{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;min-width:0}.lpkey{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:11px;color:var(--mute)}.lpkey i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}.lpkey i.dash{width:14px;height:0;border-radius:0;border-top:2px dashed var(--bad);vertical-align:3px}
.bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;color:var(--mute);font:600 12px/1 inherit;padding:6px 10px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--ink)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap;z-index:5;display:none}
.chart .tip b{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.tbl th.s{cursor:pointer;user-select:none}.tbl th.s:hover{color:var(--ink2)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--s2)}
.tblwrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.sym{font-weight:650}.addr{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.tag{font-size:11px;font-weight:650;padding:2px 7px;border-radius:6px;background:var(--s3);color:var(--ink2)}
.tag.stop{color:var(--bad)}.tag.tp{color:var(--good)}.tag.sell{color:var(--ink2)}.tag.maxhold{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--s1);color:var(--ink2);border-radius:99px;padding:6px 11px;font:600 12px/1 inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input.q{border:1px solid var(--line);background:var(--s1);color:var(--ink);border-radius:10px;padding:8px 11px;font:13px inherit;min-width:180px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sum{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--mute)}
.sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.gauge{position:relative;height:8px;border-radius:4px;background:var(--s3);margin-top:6px}
.gauge>i{position:absolute;top:0;left:0;height:100%;border-radius:4px}
.gauge>u{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink2);border-radius:1px}
.wcard{cursor:pointer}.wcard:hover{border-color:var(--line2)}
/* MC 2026-10-27 Wallets tab rebuilt around the groups the bot copies by (A-list, audited, earned, trial, benched) */
.wl-hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;padding:22px 24px;border-radius:20px;border:1px solid var(--line);background:radial-gradient(120% 170% at 0% 0%,color-mix(in srgb,#2fbf71 16%,var(--s1)) 0%,var(--s1) 58%)}
.wl-hero h2{margin:4px 0 0;font-size:28px;font-weight:800;letter-spacing:-.025em}
.wl-facts{display:flex;gap:10px;flex-wrap:wrap}
.wl-fact{background:color-mix(in srgb,var(--s2) 80%,transparent);border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:92px}
.wl-fact span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}.wl-fact b{display:block;margin-top:3px;font-size:17px;font-variant-numeric:tabular-nums}
.wl-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px}
.wl-tab{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:13px 14px 12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--s1);position:relative;overflow:hidden;min-width:0;transition:border-color .15s,transform .15s,box-shadow .15s}
.wl-tab:hover{border-color:var(--line2);transform:translateY(-1px)}.wl-tab:focus-visible{outline:2px solid var(--gc);outline-offset:2px}
.wl-tab[aria-pressed="true"]{border-color:color-mix(in srgb,var(--gc) 65%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--gc) 15%,var(--s1)),var(--s1));box-shadow:0 12px 30px color-mix(in srgb,var(--gc) 14%,transparent)}
.wl-tab::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gc)}
.wl-tn{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}.wl-tn i{width:8px;height:8px;border-radius:50%;background:var(--gc);box-shadow:0 0 10px var(--gc)}
.wl-tab b{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.wl-tv{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-about{margin-top:14px;display:grid;grid-template-columns:minmax(0,1.7fr) repeat(3,minmax(0,1fr));gap:16px;align-items:start;padding:16px 18px;border-radius:16px;border:1px solid var(--line);border-top:2px solid var(--gc);background:var(--s1)}
.wl-about h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}.wl-about p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.55}
.wl-about .k span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}.wl-about .k b{display:block;margin-top:4px;font-size:15px}.wl-about .k em{display:block;font-style:normal;color:var(--mute);font-size:12px;margin-top:2px;line-height:1.4}
.wl-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:18px 0 12px}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.wl-card{position:relative;padding:15px 16px 14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--s2),var(--s1) 65%);overflow:hidden;min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.wl-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--gc) 45%,var(--line2));box-shadow:0 14px 34px rgba(0,0,0,.28)}
.wl-card::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--gc),transparent 75%)}
.wl-top{display:flex;align-items:center;gap:10px;min-width:0}
.wl-rk{font-size:11px;font-weight:800;color:var(--faint);min-width:18px;flex:none;font-variant-numeric:tabular-nums}
.wl-av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 11px var(--mono);color:#fff;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.wl-id{display:flex;flex-direction:column;min-width:0;flex:1}.wl-id b{font-size:13px;color:var(--ink)}.wl-id span{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-chip{font-size:10.5px;font-weight:750;padding:3px 8px;border-radius:99px;white-space:nowrap;flex:none}.wl-chip.on{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}.wl-chip.off{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.wl-mid{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:12px}
.wl-net{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1;font-variant-numeric:tabular-nums}
.wl-s{font-size:12px;color:var(--mute);margin-top:6px}
.wl-spk{flex:none;display:block}.wl-spk.none{width:96px;height:34px}
.wl-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.wl-st span{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wl-st b{display:block;font-size:13.5px;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-prog{margin-top:11px;font-size:12px;color:var(--mute)}

.wl-pills{display:flex;flex-wrap:wrap;gap:6px}
.wl-pill{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--s2);font-size:12px}.wl-pill:hover{border-color:var(--line2)}.wl-pill .addr{font-size:11.5px}

@media (max-width:640px){.wl-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.wl-fact{min-width:0}.wl-hero{padding:18px}.wl-hero h2{font-size:24px}.wl-tabs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}.wl-tab{flex:0 0 152px;scroll-snap-align:start}.wl-about{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.wl-grid{grid-template-columns:minmax(0,1fr)}.wl-st{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cond{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.cond:last-child{border-bottom:0}
.ok{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.ok.y{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}.ok.n{background:var(--s3);color:var(--faint)}
.days{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.day{flex:1;min-width:64px;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px}
.day b{display:block;font-size:13px}
.log{font:12px/1.55 var(--mono);color:var(--ink2);white-space:pre-wrap;word-break:break-word;max-height:70vh;overflow:auto}
.log div{padding:1px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.empty{color:var(--faint);font-size:13px;padding:14px 0}
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.on{display:block}
.drawer .bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.drawer .pn{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:18px 16px 40px;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}

   blips each time it passes; the curve draws itself once on load. Motion is off for people who ask for less. */
.lg{position:relative;flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#10223d,#060a16 70%);box-shadow:inset 0 0 0 1px rgba(79,209,255,.32),0 0 0 3px rgba(79,209,255,.06),0 6px 20px rgba(79,209,255,.22)}

.lg svg{width:100%;height:100%;display:block}
.lg-r{fill:none;stroke:#4fd1ff;stroke-opacity:.2;stroke-width:.8}.lg-x{stroke:#4fd1ff;stroke-opacity:.1;stroke-width:.6}
.lg-sw{transform-origin:16px 16px;transform-box:view-box;animation:lgSweep 3.6s linear infinite}

@keyframes lgSweep{to{transform:rotate(360deg)}}@keyframes lgDraw{to{stroke-dashoffset:0}}
@keyframes lgPing{0%,4%{transform:scale(.6);opacity:0}8%{transform:scale(1);opacity:1}40%,100%{transform:scale(3.2);opacity:0}}

// ---------- charts (plain SVG, crosshair + tooltip) ----------
function lineChart(el,series,{h=240,fmtY=usd,fmtX=dt}={}){
  const W=Math.max(280,el.clientWidth||600),P={l:52,r:12,t:12,b:26},iw=W-P.l-P.r,ih=h-P.t-P.b;
  const all=series.flatMap(s=>s.pts);if(!all.length){el.innerHTML='<div class="empty">Nothing to chart yet.</div>';return}
  const x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0]))||x0+1;
  let y0=Math.min(0,...all.map(p=>p[1])),y1=Math.max(0,...all.map(p=>p[1]));if(y0===y1){y1+=1}
  const pad=(y1-y0)*.08;y0-=pad;y1+=pad;
  const X=t=>P.l+(x1===x0?iw/2:(t-x0)/(x1-x0)*iw),Y=v=>P.t+(1-(v-y0)/(y1-y0))*ih;
  const nice=(a,b,n)=>{const st=Math.pow(10,Math.floor(Math.log10((b-a)/n)));const m=[1,2,2.5,5,10].find(m=>(b-a)/(st*m)<=n)*st;const o=[];for(let v=Math.ceil(a/m)*m;v<=b;v+=m)o.push(+v.toFixed(6));return o};
  const yt=nice(y0,y1,4);
  let g=yt.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v===0?'':'stroke-dasharray="2 4"'}/><text x="${P.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)">${fmtY(v).replace('+','')}</text>`).join('');
  const xt=W<560?2:4,span=x1-x0,fx=t=>span<86400*1.5?tm(t):span<86400*7?new Date(t*1000).toLocaleString('en-US',{...ET,month:'short',day:'numeric',hour:'numeric'}):new Date(t*1000).toLocaleDateString('en-US',{...ET,month:'short',day:'numeric'});for(let i=0;i<=xt;i++){const t=x0+(x1-x0)*i/xt;g+=`<text x="${X(t)}" y="${h-6}" text-anchor="${i===0?'start':i===xt?'end':'middle'}" font-size="11" fill="var(--faint)">${esc(fx(t))}</text>`}
  const paths=series.map(s=>`<path d="${s.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="4 4"':''}/>`).join('');
  const ends=series.map(s=>{const p=s.pts.at(-1);return p?`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${s.color}" stroke="var(--s1)" stroke-width="2"/>`:''}).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${h}" height="${h}" role="img">${g}${paths}${ends}<line id="xh" y1="${P.t}" y2="${P.t+ih}" stroke="var(--line2)" visibility="hidden"/><g id="hd"></g><rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=svg.querySelector('#xh'),hd=svg.querySelector('#hd');
  const at=(pts,t)=>{let lo=0,hi=pts.length-1;if(!pts.length)return null;if(t<=pts[0][0])return pts[0];while(lo<hi){const m=(lo+hi+1)>>1;if(pts[m][0]<=t)lo=m;else hi=m-1}return pts[lo]};
  const move=e=>{const r=svg.getBoundingClientRect(),sx=(e.touches?e.touches[0].clientX:e.clientX)-r.left,px=sx*W/r.width;if(px<P.l||px>W-P.r){out();return}
    const t=x0+(px-P.l)/iw*(x1-x0);xh.setAttribute('x1',px);xh.setAttribute('x2',px);xh.setAttribute('visibility','visible');
    const vals=series.map(s=>({s,p:at(s.pts,t)})).filter(v=>v.p);
    hd.innerHTML=vals.map(v=>`<circle cx="${X(v.p[0])}" cy="${Y(v.p[1])}" r="4.5" fill="${v.s.color}" stroke="var(--s1)" stroke-width="2"/>`).join('');
    tip.innerHTML=`<div style="color:var(--mute);margin-bottom:4px">${esc(fmtX(t))}</div>`+vals.map(v=>`<div style="display:flex;gap:10px;justify-content:space-between"><span><span class="sw" style="background:${v.s.color}"></span> ${esc(v.s.name)}</span><b>${fmtY(v.p[1])}</b></div>`).join('');
    tip.style.display='block';const tw=tip.offsetWidth,left=sx+14+tw>r.width?sx-tw-14:sx+14;tip.style.left=left+'px';tip.style.top='8px'};
  const out=()=>{xh.setAttribute('visibility','hidden');hd.innerHTML='';tip.style.display='none'};
  svg.addEventListener('mousemove',move);svg.addEventListener('touchmove',move,{passive:true});svg.addEventListener('mouseleave',out);svg.addEventListener('touchend',out);
}
function barChart(el,rows,{h=200,fmt=usd}={}){ // rows: [{label, v, color, sub}]
  if(!rows.length){el.innerHTML='<div class="empty">Nothing yet.</div>';return}
  const W=Math.max(280,el.clientWidth||600),P={l:52,r:8,t:10,b:26},iw=W-P.l-P.r,ih=h-P.t-P.b;
  let y0=Math.min(0,...rows.map(r=>r.v)),y1=Math.max(0,...rows.map(r=>r.v));if(y0===y1)y1=1;const pad=(y1-y0)*.1;y1+=pad;if(y0<0)y0-=pad;
  const Y=v=>P.t+(1-(v-y0)/(y1-y0))*ih,bw=Math.min(46,iw/rows.length*.62),step=iw/rows.length;
  let s=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line2)"/>`;
  [y1,y0].forEach(v=>{if(Math.abs(v)>1e-9)s+=`<text x="${P.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)">${fmt(v).replace('+','')}</text>`});
  rows.forEach((r,i)=>{const x=P.l+step*i+(step-bw)/2,ya=Y(Math.max(0,r.v)),yb=Y(Math.min(0,r.v)),hh=Math.max(2,yb-ya);const rad=Math.min(4,hh/2);
    s+=`<g class="b" data-i="${i}"><rect x="${P.l+step*i}" y="${P.t}" width="${step}" height="${ih}" fill="transparent"/><rect x="${x}" y="${ya}" width="${bw}" height="${hh}" rx="${rad}" fill="${r.color}"/>${rows.length<=14?`<text x="${x+bw/2}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--faint)">${esc(r.label)}</text>`:''}</g>`});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${h}" height="${h}">${s}</svg><div class="tip"></div>`;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip');
  svg.querySelectorAll('g.b').forEach(g=>{const r=rows[+g.dataset.i];const show=e=>{const b=svg.getBoundingClientRect(),gx=g.getBoundingClientRect();tip.innerHTML=`<div style="color:var(--mute)">${esc(r.label)}</div><b class="${cls(r.v)}">${fmt(r.v)}</b>${r.sub?`<div style="color:var(--mute)">${esc(r.sub)}</div>`:''}`;tip.style.display='block';let l=gx.left-b.left+gx.width/2-tip.offsetWidth/2;l=Math.max(0,Math.min(b.width-tip.offsetWidth,l));tip.style.left=l+'px';tip.style.top='0px'};
    g.addEventListener('mouseenter',show);g.addEventListener('touchstart',show,{passive:true});g.addEventListener('mouseleave',()=>tip.style.display='none')});
}

  const amt=v=>v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e3?(v/1e3).toFixed(1)+'K':v>=1?v.toFixed(2):v.toPrecision(3);

    <div class="tot"><div class="big">${usd0(W.totalUsd)}</div><div class="chg ${cls(today)}">${usd(today)} <span style="color:var(--faint);font-weight:500">(${(today>=0?'+':'')+(today/base*100).toFixed(1)}%) live today</span></div></div>
    <div class="acts"><a href="https://solscan.io/account/${esc(W.pub||'')}" target="_blank" rel="noopener"><b>↗</b>Solscan</a><a href="#" data-tab="live"><b>◷</b>Live trades</a></div>
    ${solRow}${rows||'<div class="empty" style="padding:16px">No coins held right now.</div>'}
    <div class="note" style="text-align:center;margin-top:10px">Updated ${ago<90?ago+'s':Math.round(ago/60)+'m'} ago · read-only view of the bot's wallet, refreshed every minute</div></div></div>`}
function liveTable(rows,compact){return `<div class="tblwrap"><table class="tbl"><thead><tr><th>Coin</th>${compact?'':'<th>Wallet</th>'}<th>Exit</th><th class="n">MC wallet</th><th class="n">MC in → out</th><th class="n">Held</th><th class="n">Buy fill</th><th class="n">Result</th><th class="n">Closed</th>${compact?'':'<th>Transactions</th>'}</tr></thead><tbody>${rows.map(c=>`<tr class="click" data-w="${esc(c.w)}"><td><span class="sym">${esc((c.sym||'').slice(0,12))}</span></td>${compact?'':`<td class="addr">${wh(c.w)}</td>`}<td><span class="tag ${c.why}">${WHY[c.why]||'Other'}</span></td><td class="n">${mc(c.mcW)}</td><td class="n">${mcPair(c.mcIn,c.mcOut)}</td><td class="n">${dur(c.t0,c.t1)}</td><td class="n">${c.fill==null?'–':(c.fill>0?'+':'')+c.fill.toFixed(1)+'%'}</td><td class="n ${cls(c.pnl)}"><b>${usd(c.pnl)}</b> <span style="color:var(--faint)">${c.spent?pc(c.pnl/c.spent*100):''}</span></td><td class="n" style="color:var(--mute)">${compact?tm(c.t1):dt(c.t1)}</td>${compact?'':`<td>${c.buySig?`<a href="https://solscan.io/tx/${esc(c.buySig)}" target="_blank" rel="noopener">Buy</a>`:''}${c.sellSig?` · <a href="https://solscan.io/tx/${esc(c.sellSig)}" target="_blank" rel="noopener">Sell</a>`:''}</td>`}</tr>`).join('')}</tbody></table></div>`}
function liveV(D){const L=D.live;

   <div class="note">"Now" is the live price after the 2.5% sell cost. MC is market cap: where the wallet bought, where we bought, and where it is now. Tap a row for the coin, its chart and sell options.</div></div>`}`}

// MC 2026-10-20 wallet history. The trade lists only hold the latest 400 copies, so there was no way to see everything one wallet

  const chrono=rows.slice().sort((a,b)=>a.t1-b.t1);let c=0;const pts=chrono.map(r=>[r.t1,+(c+=r.pnl).toFixed(2)]);if(pts.length)pts.unshift([pts[0][0]-1,0]);ST._hpts=pts;

// Every copy now has a price path (the bot keeps it when the copy closes and keeps sampling the price for 30 minutes after the exit,
// the "tail"). Paths come from two places: live positions in lite.charts (all open copies, not only live ones), and /api/tp for
// closed ones (newest 300). lite.recent carries copies closed in the last 20 minutes with their paths so they stay on screen and
// their tail keeps growing. Percentages are always against our own fill, so 0% is where we bought.
let TCN=0;
const fmtDt=s=>{const a=Math.abs(Math.round(s)),sg=s<0?'-':'+';if(a<90)return sg+a+'s';if(a<5400)return sg+Math.round(a/60)+'m';const h=Math.floor(a/3600),m=Math.round((a%3600)/60);return sg+h+'h'+(m?' '+m+'m':'')};

function resolveTrade(mint,tid){

  const lead=`For ${fmtLen(s.mins*60)} after we sold${s.done?'':' (still tracking)'}, the price ${s.end>=0?'rose':'fell'} <b>${Math.abs(s.end).toFixed(0)}%</b> from our exit price. Best ${s.best>=0?'+':''}${s.best.toFixed(0)}%, worst ${s.worst>=0?'+':''}${s.worst.toFixed(0)}%.`;

  if(t.hasAttribute('data-car')){carFx('launch');return}
  if(t.dataset.fm){ST.fm=t.dataset.fm;try{localStorage.setItem('cr-fm',ST.fm)}catch{}render();return}
  if(t.dataset.fskip){ST.fskip=ST.fskip===false;try{localStorage.setItem('cr-fskip',ST.fskip===false?'0':'1')}catch{}render();return}
  if(t.dataset.fmore){ST.fLim=(ST.fLim||80)+100;render();return}

  if(t.dataset.trng){ST.ttail=t.dataset.trng==='1';if(ST.pane?.kind==='coin')coinPane(ST.pane.id,ST.pane.tid);return}
  if(t.dataset.ov){ST.ov=t.dataset.ov;try{localStorage.setItem('cr-ov',ST.ov)}catch{}render();return}
  if(t.dataset.more){ST.tLimit+=60;render();return}
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.rw){ST.rw=t.dataset.rw;render();return}
  if(t.dataset.range){ST.range=t.dataset.range;try{localStorage.setItem('cr-range',ST.range)}catch{}render();return}

// Set up but signed out: a passcode screen. Everything else is the normal Kalshi dashboard plus a Connections tab.
const KG={step:1,setup:null};
async function kxBoot(){let me=null;try{const r=await fetch('/api/me',{cache:'no-store',credentials:'same-origin'});me=await r.json()}catch{}
  if(!me){kxGate('<h1>Can\'t reach the dashboard</h1><p>Check the connection and reload.</p>');return}
  ST.me=me;if(!me.setup){kxSetup(1);return}if(!me.authed){kxLogin();return}
  document.body.classList.remove('kg-on');paintApply();tabsHtml();loadMe();load();kxStartLoops()}
function kxGate(inner){let g=$('#kgate');if(!g){g=document.createElement('div');g.id='kgate';document.body.appendChild(g)}document.body.classList.add('kg-on');
  g.innerHTML=`<div class="kg-bg"></div><div class="kg-card"><div class="kg-brand">${$('.side .brand .lg')?.outerHTML||''}<b>Kalshi Radar</b></div>${inner}</div>`;setTimeout(()=>g.querySelector('[autofocus]')?.focus(),40)}
function kxSteps(n){return `<div class="kg-steps">${['Passcode','Paper account','Kalshi key'].map((t,i)=>`<span class="${i+1<n?'done':i+1===n?'on':''}"><i>${i+1<n?'✓':i+1}</i>${t}</span>`).join('')}</div>`}
function kxSetup(n){KG.step=n;
  if(n===1)kxGate(`${kxSteps(1)}<h1>Create your passcode</h1><p>This dashboard is yours alone. The passcode signs you in on each phone or computer you use; there is no username.</p>
    <label class="kg-l">Passcode<input id="kg-p1" type="password" autocomplete="new-password" minlength="8" placeholder="at least 8 characters" autofocus></label>
    <label class="kg-l">Type it again<input id="kg-p2" type="password" autocomplete="new-password" placeholder="same passcode"></label>
    <div class="kg-err" id="kg-err"></div><div class="kg-acts"><button class="btn pri" onclick="kxSetupNext()">Continue</button></div>`);
  if(n===2)kxGate(`${kxSteps(2)}<h1>Paper account</h1><p>Paper trading starts right away and never touches real money. It follows the rule: at 10 minutes left in each 15-minute crypto market, buy the side priced 90¢ or more and hold it to settlement. You can change all of this later in Settings.</p>
    <div class="kg-row"><label class="kg-l">Starting bank<div class="kg-ipx"><i>$</i><input id="kg-bank" type="number" min="100" step="100" value="1000"></div></label><label class="kg-l">Size per trade<div class="kg-ipx"><i>$</i><input id="kg-size" type="number" min="5" max="500" step="5" value="50"></div></label><label class="kg-l">Daily stop<div class="kg-ipx"><i>$</i><input id="kg-stop" type="number" min="25" step="25" value="250"></div></label></div>
    <div class="kg-err" id="kg-err"></div><div class="kg-acts"><button class="btn ghost" onclick="kxSetup(1)">Back</button><button class="btn pri" id="kg-go" onclick="kxSetupSave()">Create dashboard</button></div>`);
  if(n===3)kxGate(`${kxSteps(3)}<h1>Connect Kalshi <small>(optional)</small></h1><p>Only needed for live trading or to show your Kalshi cash. Paper works without it, and you can do this later on the Connections page.</p>${kxConnForm('kg')}
    <div class="kg-acts"><button class="btn ghost" onclick="location.reload()">Skip for now</button><button class="btn pri" onclick="kxConnSave('kg',true)">Test and connect</button></div>`)}
function kxSetupNext(){const a=$('#kg-p1').value,b=$('#kg-p2').value;if(a.length<8){$('#kg-err').textContent='Use at least 8 characters.';return}if(a!==b){$('#kg-err').textContent='The two passcodes are different.';return}KG.setup={passcode:a};kxSetup(2)}
async function kxSetupSave(){const b=$('#kg-go');b.disabled=true;b.textContent='Creating…';
  const r=await api('/api/setup',{...KG.setup,startUsd:+$('#kg-bank').value,sizeUsd:+$('#kg-size').value,dailyLossUsd:+$('#kg-stop').value,name:devName()});
  if(!r.ok){b.disabled=false;b.textContent='Create dashboard';$('#kg-err').textContent=r.msg||'That did not work.';return}KG.setup=null;kxSetup(3)}
function kxLogin(){kxGate(`<h1>Sign in</h1><p>Enter the passcode for this dashboard.</p><label class="kg-l">Passcode<input id="kg-pw" type="password" autocomplete="current-password" autofocus onkeydown="if(event.key==='Enter')kxLoginGo()"></label>

function kxConnForm(px){return `<label class="kg-l">API Key ID<input id="${px}-kid" autocomplete="off" spellcheck="false" placeholder="e.g. 1a2b3c4d-5e6f-..."></label>

function kxConnFile(inp,px){const f=inp.files?.[0];if(!f)return;if(f.size>20000){$('#'+px+'-err').textContent='That file is too big to be a Kalshi key.';return}const rd=new FileReader();rd.onload=()=>{$('#'+px+'-pem').value=String(rd.result||'').trim();$('#'+px+'-fn').textContent=f.name+' loaded'};rd.readAsText(f)}
async function kxConnSave(px,reloadAfter,testOnly){const e=$('#'+px+'-err'),ok=$('#'+px+'-ok');e.textContent='';ok.textContent=testOnly?'Testing with Kalshi…':'Testing with Kalshi, then saving…';
  const r=await api('/api/conn',{keyId:$('#'+px+'-kid').value,privateKey:$('#'+px+'-pem').value,testOnly:!!testOnly});ok.textContent='';
  if(!r.ok){e.textContent=r.msg||'That did not work.';return}
  ok.textContent=r.msg;if(!testOnly){$('#'+px+'-pem').value='';$('#'+px+'-kid').value='';if(reloadAfter)setTimeout(()=>location.reload(),900);else{KXC.at=0;kxConnLoad(true);load()}}}

function kxConnStatus(){const d=KXC.d;if(!d)return '<div class="empty">Checking…</div>';

   :`<div class="kc-st"><i></i><div><b>Not connected</b><span>Paper trading works without a key. Live trading and your Kalshi cash need one.</span></div></div>${d.err?`<div class="kx-warn bad">${esc(d.err)}</div>`:''}`}
async function kxConnDel(){const ok=await confirmBox({title:'Remove the Kalshi key?',body:'Live trading turns off and the saved key is deleted from this dashboard. Open live positions stay on Kalshi and settle there. Paper keeps running.',confirm:'Remove key',danger:true,hold:true});if(!ok)return;const r=await api('/api/conn/delete',{});(r.ok?toast:x=>toastP('','').err('Not removed',x))(r.msg||'Done');KXC.at=0;kxConnLoad(true);load()}
async function kxPassChange(){modal(`<h2>Change passcode</h2><p>Other devices are signed out when it changes.</p><label class="kg-l">Current passcode<input id="kp-c" type="password" autocomplete="current-password" autofocus></label><label class="kg-l">New passcode<input id="kp-n" type="password" autocomplete="new-password" placeholder="at least 8 characters"></label><div class="kg-err" id="kp-e"></div>
  <div class="acts"><button class="btn ghost" data-mx="0">Cancel</button><button class="btn pri" data-mx="1">Change</button></div>`);$('#mbox [data-mx="0"]').onclick=closeModal;
  $('#mbox [data-mx="1"]').onclick=async()=>{const r=await api('/api/passcode',{current:$('#kp-c').value,next:$('#kp-n').value});if(!r.ok){$('#kp-e').textContent=r.msg;return}closeModal();toast(r.msg)}}
async function kxSignOut(all){const ok=await confirmBox({title:all?'Sign out every device?':'Sign out of this device?',body:all?'Every phone and computer, including this one, will need the passcode again.':'You will need the passcode to sign back in here.',confirm:'Sign out',danger:all});if(!ok)return;await api('/api/logout',{all:!!all});location.reload()}
function lockDevice(){kxSignOut(false)}
function unlockFlow(){kxLogin()}
function kxConnV(D){after.kconn=()=>{kxConnLoad(true);kxVerCheck();getJ('/api/devices').then(l=>{const e=$('#kxdev');if(e&&Array.isArray(l))e.innerHTML=l.map(x=>`<div class="kc-dev"><b>${esc(x.name)}${x.me?' <small>this device</small>':''}</b><span>signed in ${new Date(x.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})} · last seen ${new Date(x.seen).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></div>`).join('')})};
  return kxSecHead('Connections','Your Kalshi key and who can open this dashboard. Keys are tested with Kalshi before they are saved, stored encrypted in your own Cloudflare account, and never shown again.')+
  `<div class="grid kx-g32"><div class="card kx-card"><h3>Kalshi<span class="r">API key</span></h3><div id="kxconnst">${kxConnStatus()}</div>
    <div class="kc-form"><div class="lbl" style="margin:16px 0 6px">${KXC.d?.connected?'Replace the key':'Connect a key'}</div>${kxConnForm('kc')}
    <div class="kg-acts" style="justify-content:flex-start"><button class="btn" onclick="kxConnSave('kc',false,true)">Test only</button><button class="btn pri" onclick="kxConnSave('kc',false)">Test and save</button>${KXC.d?.connected?'<button class="btn dng" onclick="kxConnDel()">Remove key</button>':''}</div></div>
    <details class="kc-help"><summary>Where do I get a Kalshi API key?</summary><ol><li>Sign in at kalshi.com and open your account settings.</li><li>Find the API keys section and create a new key.</li><li>Kalshi shows a Key ID and downloads a private key file once. Keep the file somewhere safe.</li><li>Paste the Key ID here and choose the file (or paste its contents), then Test and save.</li></ol><p>The key can place orders on your account, so treat it like a password. Remove it here, or delete it on Kalshi, to cut access off.</p></details></div>
   <div><div class="card kx-card"><h3>This dashboard</h3><div class="kc-rows"><div><b>Passcode</b><span>Signs you in on each device</span><button class="btn sm" onclick="kxPassChange()">Change</button></div><div><b>Sign out</b><span>Only this device</span><button class="btn sm" onclick="kxSignOut(false)">Sign out</button></div><div><b>Every device</b><span>Including this one</span><button class="btn sm dng" onclick="kxSignOut(true)">Sign out all</button></div><div><b>Version ${KR_VERSION}</b><span id="kxver">released ${KR_DATE}</span><a class="btn sm" href="https://github.com/mcClaudeAi/kalshi-radar/blob/stable/CHANGELOG.md" target="_blank" rel="noopener">What's new</a></div></div></div>
    <div class="card kx-card" style="margin-top:14px"><h3>Signed-in devices</h3><div id="kxdev"><div class="empty">Loading…</div></div></div></div></div>`}
function kxStartLoops(){}
// MC 2026-11-08 version and update check. Each copy updates itself once a day from the stable branch (GitHub Action in the repo);
// this only tells the owner whether a newer release is out and when it will arrive.
const KR_VERSION='1.0.0',KR_DATE='Nov 8, 2026';
async function kxVerCheck(){const e=$('#kxver');if(!e)return;try{const r=await fetch('https://raw.githubusercontent.com/mcClaudeAi/kalshi-radar/stable/VERSION',{cache:'no-store'});if(!r.ok)return;const v=(await r.text()).trim();
  const cmp=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0)}return 0};
  e.innerHTML=cmp(v,KR_VERSION)>0?`<span class="warn">Version ${esc(v)} is out.</span> It installs on its own within a day, or run "Update from Kalshi Radar" in your GitHub repo's Actions tab.`:`released ${KR_DATE} · up to date`}catch{}}

</script>
